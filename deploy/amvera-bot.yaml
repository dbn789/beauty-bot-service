# Конфиг сборки Amvera для проекта beauty-bot (кладётся в корень как amvera.yaml
# на ветке deploy/bot скриптом scripts/amvera-sync.sh)
build:
  dockerfile: apps/bot/Dockerfile

run:
  # Internal API бота (health-пробы платформы; публичный домен боту не нужен)
  containerPort: 8080
  # постоянное хранилище для фото (env DATA_DIR=/data в настройках проекта)
  persistenceMount: /data
